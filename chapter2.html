<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Глава 2 - Ставка на життя</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
}

#reader{
    width:100%;
    max-width:600px;
    height:100vh;
    margin:auto;
    position:relative;
    overflow:hidden;
}

#reader img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:5px;
    user-select:none;
}

/* області кліку */
.nav-left, .nav-right{
    position:absolute;
    top:0;
    width:50%;
    height:100%;
    z-index:10;
}

.nav-left{ left:0; }
.nav-right{ right:0; }

.page-info{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.6);
    padding:8px 12px;
    border-radius:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div id="reader">
    <img id="currentPage" src="page2_1.jpg" alt="Сторінка">

    <div class="page-info">
        <p>Назва коміксу: Last chance</p>
        <p>Глава: 2</p>
        <p>Сторінка: <span id="pageNumber">1</span> / 4</p>
    </div>

    <div class="nav-left" onclick="prevPage()"></div>
    <div class="nav-right" onclick="nextPage()"></div>
</div>

<script>
let pages = [
    "page2_1.jpg",
    "page2_2.jpg",
    "page2_3.jpg",
    "page2_4.jpg"
];

let current = 0;

function showPage(index){
    document.getElementById("currentPage").src = pages[index];
    document.getElementById("pageNumber").innerText = index + 1;
}

function nextPage(){
    if(current < pages.length -1){
        current++;
        showPage(current);
    }
}

function prevPage(){
    if(current > 0){
        current--;
        showPage(current);
    }
}

/* свайп */
let startX = 0;
let reader = document.getElementById("reader");

reader.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
});

reader.addEventListener("touchend", e=>{
    let endX = e.changedTouches[0].clientX;
    if(endX < startX - 40) nextPage();
    if(endX > startX + 40) prevPage();
});
</script>

</body>
</html>
